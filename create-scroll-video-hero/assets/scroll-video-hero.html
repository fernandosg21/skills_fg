<section class="scroll-video-hero" data-scroll-video-hero>
    <div class="scroll-video-hero__sticky">
        <div class="scroll-video-hero__inner">
            <div class="scroll-video-hero__card">
                <div class="scroll-video-hero__content" data-scroll-video-content>
                    <p class="scroll-video-hero__eyebrow">Product workflow</p>
                    <h1 class="scroll-video-hero__title">A clear headline for the scroll video hero.</h1>
                    <p class="scroll-video-hero__subtitle">
                        Use this space for the promise, product context, or story that the video demonstrates as the
                        visitor scrolls.
                    </p>
                    <div class="scroll-video-hero__actions">
                        <a class="scroll-video-hero__button scroll-video-hero__button--primary" href="#primary-action">Primary action</a>
                        <a class="scroll-video-hero__button scroll-video-hero__button--secondary" href="#learn-more">Learn more</a>
                    </div>
                </div>

                <div class="scroll-video-hero__media" aria-label="Product preview controlled by page scroll">
                    <video
                        class="scroll-video-hero__video"
                        data-scroll-video
                        src="/assets/video-hero.mp4"
                        muted
                        playsinline
                        preload="auto"
                        disablepictureinpicture
                        controlslist="nodownload nofullscreen noremoteplayback">
                    </video>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="/assets/js/scroll-video-hero.js" defer></script>
